<script>'use strict';

const STORE_KEY = 'lao-word-atlas.v1';
const DAY = 86400000;
const main = document.getElementById('main');
const modal = document.getElementById('detail');
let saveAvailable = true;
let toastTimer;
let view = 'home';
let query = '';
let page = 0;
let band = 'all';
let topic = '全部场景';
let bookTab = 'saved';
let exerciseMode = 'choice';
let exerciseSource = 'common';
let session = null;
let pendingBackup = null;
let reading = '';
let readingMarkup = '';
const defaultState = () => ({version:1, goal:20, saved:{}, progress:{}, mistakes:{}, notes:{}, days:{}});
const own = (obj, name) => Object.prototype.hasOwnProperty.call(obj, name);
const cleanId = id => typeof id === 'string' && BY_ID.has(id);
function sanitizeState(raw) {
  if (!raw || typeof raw !== 'object' || Array.isArray(raw) || raw.version !== 1) throw new Error('备份版本或格式不支持');
  const next = defaultState();
  next.goal = [5,10,20,30,50].includes(raw.goal) ? raw.goal : 20;
  for (const field of ['saved','mistakes','notes','progress']) {
    if (!raw[field] || typeof raw[field] !== 'object' || Array.isArray(raw[field])) continue;
    for (const [id, val] of Object.entries(raw[field])) {
      if (!cleanId(id)) continue;
      if (field === 'saved' && val === true) next.saved[id] = true;
      if (field === 'mistakes' && Number.isInteger(val) && val > 0) next.mistakes[id] = Math.min(val, 100000);
      if (field === 'notes' && typeof val === 'string') next.notes[id] = val.slice(0,10000);
      if (field === 'progress' && val && typeof val === 'object' && Number.isFinite(val.due) && Number.isFinite(val.interval) && val.interval >= 0) {
        next.progress[id] = {due:Math.max(0,val.due), interval:Math.min(365,val.interval), seen:Math.max(1,Math.min(100000,Number(val.seen)||1))};
      }
    }
  }
  if (raw.days && typeof raw.days === 'object') {
    for (const [date, ids] of Object.entries(raw.days)) {

let state = defaultState();
try {

} catch { saveAvailable = false; }
function save() {

}

}
function todayDone() { return new Set(state.days[dateKey()] || []).size; }
function streak() {
  let count=0;
  const date=new Date();
  if (!(state.days[dateKey(date)] || []).length) date.setDate(date.getDate()-1);
  for (let i=0;i<3660;i++) {
    if (!(state.days[dateKey(date)] || []).length) break;
    count++; date.setDate(date.getDate()-1);
  }
  return count;
}
function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function readingLine(item, compact=false) {

function searchBox(value, id='query', extra='') {
  return '<label class="search '+extra+'">'+icon('search')+'<input id="'+id+'" value="'+esc(value)+'" placeholder="搜索老挝语、中文或读音" aria-label="搜索词汇和短语" autocomplete="off"></label>';
}
const STARTER_FORMS = 'ສະບາຍດີ ຂອບໃຈ ຂ້ອຍ ເຈົ້າ ແມ່ນ ບໍ່ ມີ ໄປ ມາ ກິນ ນ້ຳ ເຂົ້າ ເຮືອນ ຄົນ ຮຽນ ພາສາ ປຶ້ມ ມື້ ເວລາ ເຮັດ'.split(' ');
const STARTERS = STARTER_FORMS.map(form => BY_FORM.get(key(form))).filter(Boolean);
function dueItems() { return ALL.filter(item => state.progress[item.id]?.due <= Date.now()).sort((a,b)=>state.progress[a.id].due-state.progress[b.id].due); }

  const fresh=[...STARTERS,...WORDS].find(item => !state.progress[item.id]);

  const chosen=WORDS.filter(item=>matches(item)&&(band==='all'||Math.floor((item.rank-1)/500)===Number(band)));
  const pages=Math.max(1,Math.ceil(chosen.length/30)); page=Math.min(page,pages-1);
  return '<div class="page-top"><div><p class="eyebrow">VOCABULARY</p><h1 class="page-title">词汇图鉴</h1><p class="sub">按语料词频排序 · 共 3,500 个独立词条</p></div><span class="subtle">当前 '+chosen.length+' 词</span></div><div class="toolbar">'+searchBox(query)+'<select id="band" class="select" aria-label="词频范围"><option value="all">全部词频</option>'+Array.from({length:7},(_,i)=>'<option value="'+i+'" '+(band==i&&band!=='all'?'selected':'')+'>'+(i*500+1)+'–'+((i+1)*500)+'</option>').join('')+'</select></div>'+
  (chosen.length?wordRows(chosen.slice(page*30,(page+1)*30))+pagination(pages):'<div class="empty"><h2>没有找到匹配词条</h2><p>试试更短的中文释义，或检查老挝文字形与声调符号。</p></div>');
}
function pagination(pages) {
  return '<div class="pagination"><button class="btn small" data-action="prev" '+(!page?'disabled':'')+'>上一页</button><span>'+(page+1)+' / '+pages+'</span><button class="btn small" data-action="next" '+(page+1>=pages?'disabled':'')+'>下一页</button></div>';

function shuffle(list) {
  const result=[...list];
  for(let i=result.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[result[i],result[j]]=[result[j],result[i]];}
  return result;
}
function startStudy(onlyDue=false, single=null) {
  modal.close();
  const due=dueItems();
  const unlearned=[...new Map([...STARTERS,...WORDS].filter(w=>!state.progress[w.id]).map(w=>[w.id,w])).values()];
  const remaining=Math.max(0,state.goal-todayDone());
  const queue=single?[single]:(onlyDue?due:[...due,...unlearned.slice(0,remaining||state.goal)]).slice(0,50);
  if(!queue.length){toast(onlyDue?'暂时没有到期词条。':'今天的词卡已完成，稍后再来复习。');return;}
  session={type:'study',items:queue,index:0,revealed:false,correct:0,answers:0,finished:false};render();window.scrollTo(0,0);
}
function exercisePool() {
  if(exerciseSource==='saved')return ALL.filter(w=>state.saved[w.id]);
  if(exerciseSource==='mistakes')return ALL.filter(w=>state.mistakes[w.id]);
  if(exerciseSource==='phrases')return PHRASES;
  if(exerciseSource==='all')return WORDS;
  return [...new Map([...STARTERS,...WORDS.slice(0,200)].map(w=>[w.id,w])).values()];
}
function startQuiz() {
  const pool=exercisePool();
  if(!pool.length){toast('这个范围还没有词条，请先收藏或选择其他范围。');return;}
  session={type:'quiz',items:shuffle(pool).slice(0,10),index:0,correct:0,answers:0,answered:false,finished:false,pool:ALL,mode:exerciseMode,choices:null};render();window.scrollTo(0,0);
}
function firstSense(item) { return item.zh.split(/[；;，,]/)[0].trim(); }
function meaningTokens(item) { return item.zh.split(/[；;，,]/).map(s=>s.trim()).filter(Boolean); }
function getChoices(item) {
  const target=new Set(meaningTokens(item));const labels=new Set([firstSense(item)]);
  const others=shuffle(session.pool).filter(w=>w.id!==item.id&&!meaningTokens(w).some(s=>target.has(s)));
  const chosen=[];
  for(const candidate of others){if(labels.has(firstSense(candidate)))continue;labels.add(firstSense(candidate));chosen.push(candidate);if(chosen.length===3)break;}
  return shuffle([item,...chosen]);
}
function recordPractice(item, correct) {
  if(!correct)state.mistakes[item.id]=(state.mistakes[item.id]||0)+1;
  save();
}
function recordReview(item, grade) {
  const old=state.progress[item.id];
  const interval=grade==='again'?10/1440:grade==='hard'?1:Math.min(365,Math.max(2,Math.round((old?.interval||1)*2.3)));
  state.progress[item.id]={due:Date.now()+interval*DAY,interval,seen:(old?.seen||0)+1};
  const today=dateKey();state.days[today]=[...new Set([...(state.days[today]||[]),item.id])];
  if(grade==='again')state.mistakes[item.id]=(state.mistakes[item.id]||0)+1;
  save();
}

  }else{
    if(!session.choices)session.choices=getChoices(item);
    content='<div class="card study-card"><p class="subtle">'+(session.mode==='choice'?'选出最贴近的中文释义':'看中文，写出对应的老挝文')+'</p><div class="'+(session.mode==='choice'?'word-large lao':'study-question')+'" '+(session.mode==='choice'?'lang="lo"':'')+'>'+esc(session.mode==='choice'?item.lo:item.zh)+'</div>'+
    (session.mode==='choice'?'<div class="answers">'+session.choices.map(c=>'<button class="answer '+(session.answered?(c.id===item.id?'correct':c.id===session.selected?'wrong':''):'')+'" data-action="answer" data-id="'+c.id+'" '+(session.answered?'disabled':'')+'>'+esc(firstSense(c))+'</button>').join('')+'</div>':'<form id="spelling-form"><input id="spelling" class="spelling" lang="lo" aria-label="老挝语拼写" autocomplete="off" spellcheck="false" '+(session.answered?'disabled':'')+' value="'+esc(session.typed||'')+'"><button class="btn primary" '+(session.answered?'disabled':'')+'>核对拼写</button></form>')+
    (session.answered?'<div class="feedback '+(session.wasCorrect?'':'error')+'">'+(session.wasCorrect?'回答正确':'已加入错题本')+'<p><span class="lao" lang="lo" style="font-size:24px">'+esc(item.lo)+'</span>　'+esc(item.zh)+'</p></div><div style="margin-top:18px">'+btn('next-question','下一题 '+icon('arrow'),'','btn primary')+'</div>':'')+'</div>';
  }
  return '<div class="session"><div class="session-top">'+btn('exit-session','← 返回','','text-btn')+'<span class="subtle">'+(session.index+1)+' / '+session.items.length+'</span></div><div class="progress-bar"><span style="width:'+(session.index/session.items.length*100)+'%"></span></div>'+content+'</div>';
}
function answer(id, typed) {
  if(!session||session.type!=='quiz'||session.answered)return;
  const item=session.items[session.index];
  const clean=text=>key(text).replace(/[\s!?。，、？！]/g,'');
  const correct=typed!==undefined?[item.lo,...(item.alt||[])].some(lo=>clean(lo)===clean(typed)):id===item.id;
  session.answered=true;session.selected=id;session.typed=typed;session.wasCorrect=correct;session.answers++;
  if(correct)session.correct++;
  recordPractice(item,correct);render();
}
function nextItem() {
  session.index++;session.revealed=false;session.answered=false;session.choices=null;session.typed='';
  if(session.index>=session.items.length)session.finished=true;
  render();
}
function readText() {
  reading=document.getElementById('reading').value.slice(0,20000);
  if(!reading.trim()){toast('先粘贴一段老挝文。');return;}
  const input=key(reading);let at=0,html='',found=0;
  while(at<input.length) {
    const form=LEXICAL_FORMS.find(f=>input.startsWith(f,at));
    if(form){const item=BY_FORM.get(form);html+='<button data-action="detail" data-id="'+item.id+'" title="'+esc(item.zh)+'">'+esc(form)+'</button>';at+=form.length;found++;}
    else{html+=esc(input[at]);at++;}
  }
  readingMarkup=html;render();toast('找到 '+found+' 处词条，可以点击查看。');
}
function exportBackup() {
  const blob=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);const link=document.createElement('a');
  link.href=url;link.download='lao-atlas-backup-'+dateKey()+'.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),5000);
  toast('已导出学习记录备份。');
}
function mergeBackup() {
  if(!pendingBackup)return;
  for(const f of ['saved','notes'])for(const [id,val]of Object.entries(pendingBackup[f])) {
    if(!own(state[f],id))state[f][id]=val;
  }
  for(const [id,val]of Object.entries(pendingBackup.mistakes))state.mistakes[id]=Math.max(state.mistakes[id]||0,val);
  for(const [id,val]of Object.entries(pendingBackup.progress)) {
    if(!state.progress[id]||val.seen>state.progress[id].seen)state.progress[id]=val;
  }
  for(const [date,ids]of Object.entries(pendingBackup.days))state.days[date]=[...new Set([...(state.days[date]||[]),...ids])];
  save();pendingBackup=null;modal.close();render();toast('备份已合并，已有笔记优先保留。');
}
document.addEventListener('click',event=>{
  const target=event.target.closest('[data-action]');if(!target)return;
  const action=target.dataset.action,id=target.dataset.id,item=BY_ID.get(id);
  switch(action) {
    case 'save':
      if(!item)break;
      if(state.saved[id])delete state.saved[id];else state.saved[id]=true;
      save();
      document.querySelectorAll('[data-action="save"][data-id="'+id+'"]').forEach(b=>{b.classList.toggle('marked',!!state.saved[id]);b.setAttribute('aria-pressed',!!state.saved[id]);b.setAttribute('aria-label',state.saved[id]?'取消收藏':'收藏');});
      if((view==='book'||view==='home')&&!session)render();
      toast(state.saved[id]?'已加入我的词本。':'已取消收藏。');break;
    case 'detail':openDetail(item);break;
    case 'speak':if(item)speak(item);break;
    case 'close':modal.close();break;
    case 'settings':settings();break;
    case 'about':about();break;
    case 'goto':navigate(id);break;
    case 'study':startStudy();break;
    case 'due':startStudy(true);break;
    case 'single-study':if(item)startStudy(false,item);break;
    case 'reveal':session.revealed=true;render();break;
    case 'rate':if(session&&!session.finished){recordReview(session.items[session.index],id);nextItem();}break;
    case 'exit-session':session=null;render();break;
    case 'next':page++;render();window.scrollTo(0,0);break;
    case 'prev':page=Math.max(0,page-1);render();window.scrollTo(0,0);break;
    case 'topic':topic=id;page=0;render();break;
    case 'booktab':bookTab=id;query='';page=0;render();break;
    case 'mode':exerciseMode=id;render();break;
    case 'quiz':startQuiz();break;
    case 'answer':answer(id);break;
    case 'next-question':if(session?.answered)nextItem();break;
    case 'lookup':{
      const match=BY_FORM.get(key(id));if(match)openDetail(match);else{modal.close();query=id;page=0;view='words';location.hash='words';render();toast('按短语中的词查找。');}break;
    }
    case 'note':{
      if(!item)break;const val=document.getElementById('note').value.slice(0,10000);
      if(val.trim())state.notes[id]=val;else delete state.notes[id];save();toast('笔记已保存。');break;
    }
    case 'clear-mistake':delete state.mistakes[id];save();openDetail(item);render();toast('已移出错题本。');break;
    case 'read':readText();break;
    case 'export':exportBackup();break;
    case 'import':document.getElementById('backup-input').click();break;
    case 'confirm-import':mergeBackup();break;
  }
});
document.addEventListener('input',event=>{
  const el=event.target;
  if (event.isComposing) return;
  if(el.id==='home-query') {
    if(!el.value.trim())return;
    query=el.value;page=0;view='words';history.replaceState(null,'','#words');render();
    const input=document.getElementById('query');input.focus();input.setSelectionRange(query.length,query.length);
  } else if(el.id==='query') {
    query=el.value;page=0;const pos=el.selectionStart;render();const next=document.getElementById('query');next.focus();next.setSelectionRange(pos,pos);
  } else if(el.id==='reading')reading=el.value;
});
document.addEventListener('compositionend',event=>{
  if (['query','home-query'].includes(event.target.id)) event.target.dispatchEvent(new Event('input',{bubbles:true}));
});
document.addEventListener('change',event=>{
  const el=event.target;
  if(el.id==='band'){band=el.value;page=0;render();}
  if(el.id==='exercise-source')exerciseSource=el.value;
  if(el.id==='goal'){state.goal=Number(el.value);save();render();toast('每日目标已更新。');}
});
document.addEventListener('submit',event=>{
  if(event.target.id==='spelling-form'){event.preventDefault();const value=document.getElementById('spelling').value;if(value.trim())answer(null,value);}
});
document.getElementById('backup-input').addEventListener('change',async event=>{
  const file=event.target.files[0];event.target.value='';if(!file)return;
  try{
    if(file.size>5000000)throw new Error('备份文件超过 5 MB');
    pendingBackup=sanitizeState(JSON.parse(await file.text()));
    openModal(modalTitle('合并学习记录')+'<p>文件中有 '+Object.keys(pendingBackup.saved).length+' 个收藏、'+Object.keys(pendingBackup.progress).length+' 个学习记录和 '+Object.keys(pendingBackup.notes).length+' 条笔记。重复记录会合并，同一词条已有的笔记优先保留。</p>'+btn('confirm-import','确认合并','','btn primary'));
  }catch(err){pendingBackup=null;toast('导入失败，请选择从本网站导出的有效 JSON 备份。');}
});
window.addEventListener('hashchange',()=>{
  const next=location.hash.slice(1);view=['home','words','phrases','practice','book'].includes(next)?next:'home';page=0;session=null;
  if(view!=='words')query='';render();window.scrollTo(0,0);
});
window.addEventListener('storage',event=>{
  if(event.key!==STORE_KEY||!event.newValue)return;
  try{state=sanitizeState(JSON.parse(event.newValue));if(!modal.open)render();}catch{}
});
view=['home','words','phrases','practice','book'].includes(location.hash.slice(1))?location.hash.slice(1):'home';
render();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
